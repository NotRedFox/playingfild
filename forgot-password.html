<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - &gt;=PlayingFild</title>
  <link rel="preload" href="fonts/Caveat-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Caveat-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/PatrickHand-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    html body { visibility: visible; }
    html.fonts-loading.theme-notebook body { visibility: visible; }
  </style>
  <link rel="stylesheet" href="shared/brand-tokens.css">
  <link rel="stylesheet" href="themes/fonts.css">
  <link rel="stylesheet" href="themes/signup-notebook.css">
  <script src="themes/font-load.js"></script>
  <script src="signup-bootstrap.js"></script>
  <style>
    :root {
      --bg: #f4f4f9;
      --card: #ffffff;
      --card-border: rgba(91, 75, 159, 0.12);
      --text: #333;
      --text-muted: #666;
      --accent: var(--pf-purple-600, #5B4B9F);
      --accent-hover: var(--pf-purple-700, #4A3D85);
      --accent-text: #ffffff;
      --error: #dc3545;
      --info: var(--pf-purple-500, #6B5BB0);
      --input-bg: #ffffff;
      --input-border: #d1d5db;
      --input-focus: var(--pf-purple-600, #5B4B9F);
      --brand-accent: var(--pf-purple-600, #5B4B9F);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--brand-accent);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 12px rgba(91, 75, 159, 0.08);
    }

    .logo {
      font-size: 1.4em;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--pf-purple-600, #5B4B9F);
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9em;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.85em;
      color: var(--text);
      font-weight: 500;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 15px 18px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1.05em;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(91, 75, 159, 0.15);
    }

    input:disabled { opacity: 0.5; cursor: not-allowed; }

    .code-input {
      letter-spacing: 0.4em;
      text-align: center;
      font-size: 1.15em;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 6px;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s ease, transform 0.1s ease;
      font-family: inherit;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85em;
      margin-bottom: 14px;
      display: none;
    }

    .message.error {
      display: block;
      background: rgba(220, 53, 69, 0.08);
      border: 1px solid rgba(220, 53, 69, 0.25);
      color: var(--error);
    }

    .message.success {
      display: block;
      background: rgba(91, 75, 159, 0.08);
      border: 1px solid rgba(91, 75, 159, 0.25);
      color: var(--pf-purple-text, #4A3D85);
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .done-state {
      text-align: center;
      padding: 24px 0;
    }

    .done-state .check {
      font-size: 2.5em;
      margin-bottom: 12px;
    }

    .done-state h2 {
      color: var(--pf-purple-600, #5B4B9F);
      font-size: 1.2em;
      margin-bottom: 8px;
    }

    .done-state p {
      color: var(--text-muted);
      font-size: 0.9em;
      max-width: 300px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .footer-text {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78em;
      margin-top: 18px;
      line-height: 1.5;
    }

    .footer-text a {
      color: var(--pf-purple-600, #5B4B9F);
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    .hint-text {
      font-size: 0.78em;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <svg style="position:fixed;top:0;left:0;width:0;height:0;pointer-events:none;" aria-hidden="true">
    <defs>
      <filter id="notebook-sketch" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="card">
    <div class="logo">&gt;=PlayingFild</div>

    <!-- Main form -->
    <div id="resetSection">
      <div class="subtitle">Enter the 6-digit code from your email along with your new password.</div>
      <div id="formMessage" class="message"></div>
      <form id="resetForm" autocomplete="off">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="code">6-Digit Verification Code</label>
          <input type="text" id="code" name="code" class="code-input" placeholder="000000" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code">
          <div class="hint-text">Check your email for the 6-digit code.</div>
        </div>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" id="submitBtn">
          <span id="submitText">Reset Password</span>
        </button>
      </form>
    </div>

    <!-- Success state -->
    <div id="doneState" class="done-state" style="display: none;">
      <div class="check">✅</div>
      <h2>Password Successfully Updated</h2>
      <p>Your password has been changed. You can now close this tab and sign in with your new password.</p>
    </div>

    <div class="footer-text">
      <a href="signup.html">Back to sign in</a>
    </div>
  </div>

  <script type="module" src="forgot-password.js"></script>
</body>
</html>
